name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ cmake pkg-config \
            ninja-build python3-pip \
            libdrm-dev libwayland-dev libelf-dev \
            zlib1g-dev libzstd-dev libexpat1-dev \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev \
            libxshmfence-dev libxxf86vm-dev \
            libxcb-dri2-0-dev libxcb-dri3-dev libxcb-glx0-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libx11-xcb-dev \
            libwayland-egl-backend-dev wayland-protocols \
            bison flex glslang-tools spirv-tools \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev \
            libclc-18-dev libllvmspirvlib-18-dev \
            libsensors-dev libvulkan-dev x11proto-dev linux-libc-dev \
            python3-mako python3-ply python3-setuptools python3-packaging python3-yaml
          pip3 install meson==1.4.0 ninja

      - name: Verify sources.lock pinned
        run: python3 -c "import json; d=json.load(open('sources.lock')); print('OK')"

      - name: Fetch Mesa
        run: ./scripts/fetch-mesa.sh

      - name: Apply Patches (g615-v11-csf)
        run: ./scripts/apply-patches.sh --profile g615-v11-csf

      - name: Fix panvk_cmd_pool, u_gralloc Swapchain, and WoW64 32-bit mmap
        run: |
          # 1. إصلاح خطأ gs_bo_pool
          sed -i 's/pool->gs_bo_pool/pool->cs_bo_pool/g' work/mesa/src/panfrost/vulkan/panvk_cmd_pool.c

          # 2. تطبيق إصلاحات u_gralloc و WoW64 عبر Python
          python3 - << 'EOF'
          import os, glob, re

          # --- أ) توسيع قائمة أسماء الـ Mapper في حال البحث عن mediatek فقط ---
          for root, _, files in os.walk("work/mesa/src"):
              for f in files:
                  if f.endswith((".c", ".cpp", ".h")):
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          txt = fp.read()
                      if '"mediatek"' in txt and "mapper" in txt:
                          # إضافة default و arm كمرشحين بجانب mediatek
                          new_txt = txt.replace('"mediatek"', '"default", "mediatek", "mtk", "arm"')
                          if new_txt != txt:
                              with open(p, "w", encoding="utf-8") as fp:
                                  fp.write(new_txt)
                              print(f"[PATCHED] Added fallback mapper names in {p}")

          # --- ب) إضافة مسار احتياطي (Fallback) في u_gralloc عند فشل قراءة الشاشة ---
          u_gralloc_path = "work/mesa/src/util/u_gralloc/u_gralloc.c"
          if os.path.exists(u_gralloc_path):
              with open(u_gralloc_path, "r", encoding="utf-8") as fp:
                  code = fp.read()
              # استبدال رسالة الفشل بمسار احتياطي يملأ بيانات الشاشة القياسية بدل إيقاف Swapchain
              target = 'mesa_loge("u_gralloc_get_buffer_basic_info failed");'
              fallback_code = '''
              mesa_logw("u_gralloc_get_buffer_basic_info failed -> using MT6833 linear RGBA fallback");
              out->drm_fourcc = 0x34324241; /* DRM_FORMAT_ABGR8888 */
              out->modifier = 0;            /* DRM_FORMAT_MOD_LINEAR */
              out->num_planes = 1;
              out->offsets[0] = 0;
              out->strides[0] = (buf->pixel_stride ? buf->pixel_stride : 1080) * 4;
              return 0;
              '''
              if target in code:
                  code = code.replace(target, fallback_code)
                  with open(u_gralloc_path, "w", encoding="utf-8") as fp:
                      fp.write(code)
                  print("[PATCHED] Injected u_gralloc Swapchain fallback in u_gralloc.c")

          # --- ج) إجبار جميع تعيينات الذاكرة (mmap) في kbase على البقاء تحت 4GB لتطبيقات 32-bit ---
          kbase_files = glob.glob("work/mesa/src/**/panfrost_kmod_kbase.c", recursive=True)
          for kp in kbase_files:
              with open(kp, "r", encoding="utf-8") as fp:
                  kcode = fp.read()

              helper_func = '''
          /* Helper: Find a free 32-bit virtual address (< 2GB) for WoW64 compatibility */
          static void *pan_wow64_ enforce_low_mmap(void *placed_addr, size_t size, int prot, int flags, int fd, off_t offset) {
              void *ret = MAP_FAILED;
              if (placed_addr != NULL) {
                  ret = os_mmap(placed_addr, size, prot, flags | MAP_FIXED, fd, offset);
                  if (ret == MAP_FAILED) {
                      /* Kernel 4.14 kbase rejects MAP_FIXED over Wine's PROT_NONE VMA; unmap placeholder first */
                      munmap(placed_addr, size);
                      ret = os_mmap(placed_addr, size, prot, flags & ~MAP_FIXED, fd, offset);
                  }
                  if (ret != MAP_FAILED)
                      return ret;
              }
              /* When placed_addr is NULL, probe low 32-bit address space (256MB to 1.75GB) so Wine 32-bit accepts it */
              for (uintptr_t hint = 0x10000000UL; hint < 0x70000000UL; hint += 0x04000000UL) {
                  void *probe = mmap((void *)hint, size, PROT_NONE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (probe != MAP_FAILED) {
                      uintptr_t addr = (uintptr_t)probe;
                      munmap(probe, size);
                      if ((addr + size) < 0x7fff0000UL) {
                          ret = os_mmap((void *)addr, size, prot, flags, fd, offset);
                          if (ret != MAP_FAILED && ((uintptr_t)ret + size) < 0xfff00000UL)
                              return ret;
                          if (ret != MAP_FAILED)
                              munmap(ret, size);
                      }
                  }
              }
              return os_mmap(NULL, size, prot, flags, fd, offset);
          }
          '''
              helper_func = helper_func.replace("pan_wow64_ enforce_low_mmap", "pan_wow64_enforce_low_mmap")
              if "pan_wow64_enforce_low_mmap" not in kcode:
                  # إدراج الدالة المساعدة بعد ملفات الـ include
                  insert_pos = kcode.rfind("#include")
                  insert_pos = kcode.find("\n", insert_pos) + 1
                  kcode = kcode[:insert_pos] + "\n" + helper_func + "\n" + kcode[insert_pos:]
                  # تحويل استدعاءات os_mmap داخل ملف kbase إلى الدالة المحسنة
                  kcode = re.sub(r'\bos_mmap\s*\(', 'pan_wow64_enforce_low_mmap(', kcode)
                  # إعادة os_mmap داخل الدالة المساعدة نفسها كي لا تستدعي نفسها بشكل لا نهائي
                  kcode = kcode.replace("ret = pan_wow64_enforce_low_mmap(", "ret = os_mmap(", 3)
                  kcode = kcode.replace("return pan_wow64_enforce_low_mmap(NULL,", "return os_mmap(NULL,", 1)
                  with open(kp, "w", encoding="utf-8") as fp:
                      fp.write(kcode)
                  print(f"[PATCHED] Injected WoW64 <4GB mmap wrapper in {kp}")
          EOF

      - name: Compile Android Driver
        run: ./scripts/build-android.sh --profile g615-v11-csf

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-g615-v11-csf
          path: dist/android-g615-v11-csf/
