name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ cmake pkg-config \
            ninja-build python3-pip \
            libdrm-dev libwayland-dev libelf-dev \
            zlib1g-dev libzstd-dev libexpat1-dev \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev \
            libxshmfence-dev libxxf86vm-dev \
            libxcb-dri2-0-dev libxcb-dri3-dev libxcb-glx0-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libx11-xcb-dev \
            libwayland-egl-backend-dev wayland-protocols \
            bison flex glslang-tools spirv-tools \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev \
            libclc-18-dev libllvmspirvlib-18-dev \
            libsensors-dev libvulkan-dev x11proto-dev linux-libc-dev \
            python3-mako python3-ply python3-setuptools python3-packaging python3-yaml
          pip3 install meson==1.4.0 ninja

      - name: Verify sources.lock pinned
        run: python3 -c "import json; d=json.load(open('sources.lock')); print('OK')"

      - name: Fetch Mesa
        run: ./scripts/fetch-mesa.sh

      - name: Apply Patches (g615-v11-csf)
        run: ./scripts/apply-patches.sh --profile g615-v11-csf

      - name: Fix panvk_cmd_pool compile error
        run: |
          sed -i 's/pool->gs_bo_pool/pool->cs_bo_pool/g' work/mesa/src/panfrost/vulkan/panvk_cmd_pool.c

      - name: Compile Android Driver
        run: ./scripts/build-android.sh --profile g615-v11-csf

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-g615-v11-csf
          path: dist/android-g615-v11-csf/
